services:
  gallery:
    build:
      context: .
      target: runtime
      args:
        VITE_API_BASE_URL: /api
    image: fluent-gallery:1.0.0
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      GALLERY_DB_PATH: /app/data/gallery.db
      LOCAL_UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3001"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s
